<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sai Anu Furniture — Admin Login</title><style>body{font-family:Arial;background:#fff9f2;color:#28221e;margin:0;min-height:100vh;display:grid;place-items:center}.box{background:white;padding:26px;border-radius:16px;width:min(92%,390px);box-shadow:0 8px 30px #56352220}h1{color:#563522;font-size:22px}label{display:block;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbb9aa;border-radius:8px}button{margin-top:18px;width:100%;padding:13px;background:#563522;color:white;border:0;border-radius:8px;font-weight:bold}#msg{font-size:14px;line-height:1.5}.hint{font-size:12px;color:#6e6259}</style></head><body><main class="box"><h1>SAI ANU FURNITURE<br>Private Admin Login</h1><p>Authorised owner access only.</p><form id="loginForm"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Log in securely</button></form><p id="msg" role="status"></p><p class="hint">If you are not the authorised owner, close this page.</p></main><script type="module" src="admin.js"></script></body></html>
